<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sheet To-Do</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<meta name="theme-color" content="#1a73e8">
<style>
  :root { --bg:#fff; --fg:#202124; --mut:#5f6368; --line:#e0e0e0; --acc:#1a73e8; --card:#f8f9fa; --bad:#d93025; --soon:#1a73e8; --tmrw:#e8710a; --good:#188038; --bonus:#f9ab00; }
  @media (prefers-color-scheme: dark) { :root { --bg:#16181b; --fg:#e8eaed; --mut:#9aa0a6; --line:#3c4043; --acc:#8ab4f8; --card:#202327; --bad:#f28b82; --soon:#8ab4f8; --tmrw:#fcad70; --good:#81c995; --bonus:#fdd663; } }
  * { box-sizing: border-box; }
body, button, select, input, textarea { text-transform: lowercase; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.4 system-ui,sans-serif; }
  main { max-width:720px; margin:0 auto; padding:16px; }
  header { display:flex; align-items:center; gap:8px; margin-bottom:12px; }
  h1 { font-size:20px; margin:0; }
  #searchRow { display:flex; gap:8px; margin-bottom:12px; } #searchRow[hidden] { display:none; } #q { flex:1; min-width:0; }
  #searchBtn.on { background:var(--acc); color:#fff; border-color:var(--acc); }
  button, select, input, textarea { font:inherit; color:inherit; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:8px 10px; }
  button { cursor:pointer; } button.primary { background:var(--acc); color:#fff; border-color:var(--acc); }
  #status { flex:1; min-width:0; text-align:center; color:var(--mut); font-size:12px; line-height:1.2; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  textarea[name=notes] { min-height:7.5em; resize:vertical; }
  form#add { display:grid; grid-template-columns:1fr auto auto; gap:8px; margin-bottom:12px; }
  @media (max-width:520px) { form#add { grid-template-columns:minmax(0,1fr) minmax(0,1fr); } form#add input[name=task] { grid-column:1/-1; } }
  #more { grid-column:1/-1; margin-top:0; } #more[hidden] { display:none; }
  #more .btns { display:grid; grid-template-columns:1fr 1fr; gap:8px; } #more .btns button { padding:12px; }
  #addClose { border:2px solid var(--bad); color:var(--bad); font-weight:600; }
  .filters { margin-bottom:12px; } .frow { display:flex; gap:6px; overflow-x:auto; } .frow + .frow { margin-top:6px; }
  .filters button { flex:1 1 0; min-width:0; font-size:13px; padding:6px 2px; text-align:center; }
  .filters button.on { background:var(--acc); color:#fff; border-color:var(--acc); }
  .item { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:8px; }
  .row { display:flex; align-items:center; gap:10px; }
  .row .t { flex:1; word-break:break-word; } .done .t { text-decoration:line-through; color:var(--mut); }
  .due { font-size:13px; color:var(--mut); } .due.over { color:var(--bad); font-weight:600; } .due.soon { color:var(--soon); font-weight:600; } .due.tmrw { color:var(--tmrw); font-weight:600; }
  .rep { color:var(--mut); font-size:12px; margin:4px 0 0 30px; }
  .notes { color:var(--mut); font-size:14px; margin:6px 0 0 30px; white-space:pre-wrap; }
  .edit > *, .edit .two > *, .three > *, #more > * { min-width:0; max-width:100%; }
  .edit select, .edit input, .edit textarea { width:100%; }
  .edit .two { grid-template-columns:minmax(0,1fr) minmax(0,1fr); }
  input[type=date] { min-width:0; width:100%; -webkit-appearance:none; appearance:none; }
  input[type=date]::-webkit-date-and-time-value { text-align:left; }
  .edit input[type=number] { padding-left:4px; padding-right:4px; text-align:center; }
  .item.met { border-left:4px solid var(--good); } .rep.met { color:var(--good); font-weight:600; } .plus.met { color:var(--good); border-color:var(--good); }
  .rep[data-a=hist] { cursor:pointer; }
  .goalbox { margin:6px 0 0 30px; } .gtop { display:flex; align-items:center; gap:10px; flex-wrap:wrap; } .gcount { font-size:14px; font-weight:600; }
  .pips { display:flex; flex-wrap:wrap; gap:5px; } .pip { width:16px; height:16px; border-radius:50%; border:2px solid var(--line); display:inline-block; }
  .pip.on { background:var(--soon); border-color:var(--soon); } .pip.met { background:var(--good); border-color:var(--good); }
  .pipsep { width:1px; height:16px; background:var(--mut); margin:0 5px; opacity:.6; align-self:center; }
  .pip.bonus { width:14px; height:14px; border:0; border-radius:0; background:var(--bonus); clip-path:polygon(50% 0, 62% 36%, 100% 38%, 70% 60%, 80% 100%, 50% 76%, 20% 100%, 30% 60%, 0 38%, 38% 36%); align-self:center; }
  .bonus-text, .hbonus { color:var(--bonus); font-weight:700; } .hbonus { margin-left:6px; letter-spacing:0; }
  .goalbox.met .gcount { color:var(--good); } .coach { font-size:13px; margin-top:4px; color:var(--mut); } .coach.tight { color:var(--tmrw); font-weight:600; } .coach.late { color:var(--bad); font-weight:600; }
  .gextra { font-size:12px; color:var(--mut); margin-top:2px; }
  .hist { margin:4px 0 0 30px; font-size:12px; color:var(--mut); font-variant-numeric:tabular-nums; }
  .hw { display:grid; grid-template-columns:5.5em 1fr 3.5em 4.5em; gap:6px; padding:2px 0; align-items:center; } .hw .dots { letter-spacing:1px; overflow:hidden; white-space:nowrap; }
  .hw.ok { color:var(--good); } .hw.short span:last-child { color:var(--bad); font-weight:600; } .hsum { margin-top:4px; } .hmore { cursor:pointer; color:var(--acc); padding:2px 0; }
  .plus { padding:3px 0; width:34px; font-size:12px; font-weight:600; color:var(--soon); border-color:var(--soon); }
  .three { display:grid; grid-template-columns:1fr 4.2em 1.3fr; gap:8px; } input:disabled { opacity:.45; }
  .edit { display:grid; gap:8px; margin-top:8px; } .edit .two { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .edit .btns { display:flex; gap:8px; justify-content:space-between; }
  input[type=checkbox] { width:22px; height:22px; }
  dialog { border:1px solid var(--line); border-radius:12px; background:var(--bg); color:var(--fg); max-width:420px; width:calc(100% - 32px); }
  dialog label { display:block; margin:8px 0 4px; font-size:14px; } dialog input { width:100%; }
</style>
</head>
<body>
<main>
  <header><h1>To-Do</h1><div id="status"></div><button id="searchBtn" title="Search" aria-label="Search">🔍</button><button id="refresh" title="Sync now">⟳</button><button id="cfg" title="Settings">⚙</button></header>
  <div id="searchRow" hidden><input id="q" type="search" placeholder="search all tasks…" autocomplete="off"><button id="qx" aria-label="Close search">✕</button></div>
  <form id="add">
    <input name="task" placeholder="New task…" required autocomplete="off">
    <input name="due" type="date" title="Due date">
    <select name="status"></select>
    <div id="more" class="edit" hidden>
      <div class="three"><select name="repeat"></select><input name="every" type="number" min="1" value="1" title="Repeat every" aria-label="Repeat every" disabled><select name="repeat_from"></select></div>
      <textarea name="notes" rows="6" placeholder="Notes"></textarea>
      <div class="btns"><button type="button" id="addClose">✕ close</button><button class="primary">add</button></div>
    </div>
  </form>
  <div class="filters" id="filters"></div>
  <div id="list"></div>
</main>

<dialog id="dlg">
  <form method="dialog" id="cfgForm">
    <h3>Connect to your sheet</h3>
    <label>Web app URL</label><input name="url" placeholder="https://script.google.com/macros/s/…/exec">
    <label>Secret token</label><input name="token" type="password">
    <p style="text-align:right"><button value="cancel">Cancel</button> <button class="primary" value="ok">Save</button></p>
  </form>
</dialog>

<script>
const $ = s => document.querySelector(s);
const STATUSES = ['todo', 'doing', 'done', 'missed'];
const REPEATS = ['', 'daily', 'weekly', 'monthly', 'yearly', 'goal']; // 'goal/4' = a weekly goal: 4 sessions a week, on any days
const UNITS = { daily: 'day', weekly: 'week', monthly: 'month', yearly: 'year' };
// the interval lives in the repeat cell: 'monthly' = every 1, 'monthly/6' = every 6 months
const repeatOpt = r => !r ? 'no repeat' : r === 'goal' ? 'times a week' : 'repeat ' + UNITS[r] + 's';
const parseRepeat = r => { const [unit, n] = String(r || '').split('/'); return { unit, n: Math.max(1, parseInt(n, 10) || 1) }; };
const fmtRepeat = (unit, n) => !unit ? '' : (n = Math.max(1, parseInt(n, 10) || 1)) > 1 ? `${unit}/${n}` : unit;
const isGoal = r => parseRepeat(r).unit === 'goal';
const repeatLabel = r => { const { unit, n } = parseRepeat(r); if (unit === 'goal') return `${n}× a week`; return n > 1 ? `every ${n} ${UNITS[unit]}s` : unit; };
const MAIN = ['Open', 'Today', 'doing', 'missed', 'done'], MORE = ['todo', 'Repeat', 'All']; // filter buttons: main row, and the ⋯ menu
let moreOpen = false;
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
const save = (k, v) => localStorage.setItem(k, JSON.stringify(v));
const norm = t => ({ repeat: '', repeat_from: '', series: '', ...t, status: String(t.status || 'todo').toLowerCase() }); // sheet may hold Done/done
const isOpen = t => t.status !== 'done' && t.status !== 'missed';
let cfg = load('cfg', {}), tasks = load('tasks', []).map(norm), queue = load('queue', []), filter = 'Today', query = '', editing = null, syncing = false, histOpen = new Set(), histAll = new Set();

const uuid = () => crypto.randomUUID ? crypto.randomUUID() : 'id-' + Date.now() + Math.random().toString(16).slice(2);
const today = () => new Date().toLocaleDateString('en-CA');
const inDays = n => { const d = new Date(); d.setDate(d.getDate() + n); return d.toLocaleDateString('en-CA'); };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const setStatus = m => { const el = $('#status'); el.textContent = m; el.title = m; };
// k periods after iso (yyyy-mm-dd); monthly/yearly clamp to the last day of shorter months
function addPeriod(iso, repeat, k) {
  const [y, m, d] = iso.split('-').map(Number), { unit, n } = parseRepeat(repeat);
  k *= n;
  if (unit === 'daily' || unit === 'weekly') return new Date(y, m - 1, d + k * (unit === 'weekly' ? 7 : 1)).toLocaleDateString('en-CA');
  const first = new Date(y, m - 1 + k * (unit === 'yearly' ? 12 : 1), 1);
  const last = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
  return new Date(first.getFullYear(), first.getMonth(), Math.min(d, last)).toLocaleDateString('en-CA');
}
// next occurrence: counted from the due date or from today (completion), always in the future so a late task doesn't pile up copies
function nextDue(t) {
  const base = t.repeat_from === 'done' ? today() : (t.due || today());
  let k = 1, n = addPeriod(base, t.repeat, k);
  while (n <= today()) n = addPeriod(base, t.repeat, ++k);
  return n;
}
// close a repeating task as done/missed and create its next occurrence (unless one is already open)
// weekly goals (Mon-Sun): one open task due on the week's Sunday, plus a done record per session logged with +1
const weekEnd = iso => addPeriod(iso, 'daily', 6 - (new Date(iso + 'T00:00').getDay() + 6) % 7);
const goalDone = t => tasks.filter(x => x.series === t.series && x.status === 'done' && x.completed_at > addPeriod(t.due, 'daily', -7) && x.completed_at <= t.due).length;
// past weeks of a goal series, newest first, built from its session (done) and shortfall (missed) rows; the open week is left out
function goalHistory(series, openEnd) {
  const weeks = {};
  tasks.filter(x => x.series === series && (x.status === 'done' ? x.completed_at : x.status === 'missed')).forEach(x => {
    const end = weekEnd(x.status === 'done' ? x.completed_at : x.due); if (end >= openEnd) return;
    const w = weeks[end] = weeks[end] || { end, done: 0, target: 0 };
    if (x.status === 'done') w.done++;
    if (!w.target || x.status === 'missed') w.target = parseRepeat(x.repeat).n;
  });
  return Object.values(weeks).sort((a, b) => b.end.localeCompare(a.end));
}
const shortDay = iso => new Date(iso + 'T00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
// the progress box under an open weekly goal: pips, counts, a coach line tied to the days left, streak and last week
function goalBox(t) {
  const n = parseRepeat(t.repeat).n, got = goalDone(t), left = Math.max(0, n - got), met = got >= n;
  const daysLeft = Math.round((new Date(t.due + 'T00:00') - new Date(today() + 'T00:00')) / 864e5) + 1;
  const dl = `${daysLeft} day${daysLeft === 1 ? '' : 's'}`;
  const bonus = Math.max(0, got - n); // sessions beyond the goal are shown apart from it: a divider, then star-shaped marks
  const pips = Array.from({ length: Math.min(10, n) }, (_, i) => `<i class="pip${i < got ? (met ? ' met' : ' on') : ''}"></i>`).join('')
    + (bonus ? `<span class="pipsep"></span>` + Array.from({ length: Math.min(6, bonus) }, () => '<i class="pip bonus"></i>').join('') : '');
  const counts = met ? `✓ ${n} of ${n} · goal met!${bonus ? ` <span class="bonus-text">+${bonus} bonus</span>` : ''}` : `${got} done · ${left} to go`;
  let coach, cls = 'ok';
  if (met) coach = bonus ? `Goal crushed. ${bonus} bonus on top.` : 'Goal crushed. Anything extra is a bonus.';
  else {
    coach = !got ? `Fresh week. ${n} to go. Start with one today.` : left === 1 ? 'One more to go!' : got * 2 === n ? 'Halfway there.' : got * 2 > n ? 'Over halfway.' : 'Good start. Keep going.';
    if (left > daysLeft) { cls = 'late'; coach += ` Only ${dl} left, every session still counts.`; }
    else if (left === daysLeft) { cls = 'tight'; coach += ` ${left} to go in ${dl}, no days off.`; }
    else coach += ` ${left} to go in ${dl}, on pace.`;
  }
  const hist = goalHistory(t.series, t.due), prev = addPeriod(t.due, 'weekly', -1);
  let streak = met ? 1 : 0, expect = prev;
  for (const w of hist) { if (w.end !== expect || w.done < w.target) break; streak++; expect = addPeriod(expect, 'weekly', -1); }
  const last = hist[0] && hist[0].end === prev ? `last week ${hist[0].done} of ${hist[0].target}` : '';
  const extra = [streak ? `🔥 ${streak} week${streak === 1 ? '' : 's'} in a row` : '', last].filter(Boolean).join(' · ');
  return `<div class="goalbox${met ? ' met' : ''}"><div class="gtop"><span class="pips" aria-label="${got} of ${n} done">${pips}</span><span class="gcount">${counts}</span></div><div class="coach ${cls}">${esc(coach)}</div>${extra ? `<div class="gextra">${esc(extra)}</div>` : ''}</div>`;
}
function histHtml(t) {
  const ws = goalHistory(t.series, t.due);
  if (!ws.length) return '<div class="hist">no past weeks yet</div>';
  let best = 0, run = 0;
  [...ws].reverse().forEach(w => { run = w.done >= w.target ? run + 1 : 0; best = Math.max(best, run); });
  const all = histAll.has(t.series), cap = all ? 52 : 12;
  const rows = ws.slice(0, cap).map(w => {
    const start = addPeriod(w.end, 'daily', -6), ok = w.done >= w.target;
    const range = shortDay(start) + '–' + (start.slice(5, 7) === w.end.slice(5, 7) ? w.end.slice(8).replace(/^0/, '') : shortDay(w.end));
    const hit = Math.min(w.done, w.target), extra = w.done - hit;
    const dots = '●'.repeat(Math.min(hit, 10)) + '○'.repeat(Math.max(0, Math.min(w.target, 10) - hit)) + (extra ? `<span class="hbonus">${'★'.repeat(Math.min(extra, 6))}</span>` : '');
    return `<div class="hw ${ok ? 'ok' : 'short'}"><span>${esc(range)}</span><span class="dots">${dots}</span><span>${hit} of ${w.target}</span><span>${ok ? '✓ met' + (extra ? ` <b class="hbonus">+${extra}</b>` : '') : 'short ' + (w.target - w.done)}</span></div>`;
  }).join('');
  return `<div class="hist">${rows}${ws.length > 12 ? `<div class="hmore" data-a="histall">${all ? (ws.length > 52 ? `${ws.length - 52} older weeks not shown · ` : '') + 'show less ▴' : `+${ws.length - 12} earlier weeks · show all ▾`}</div>` : ''}<div class="hsum">${ws.filter(w => w.done >= w.target).length} of ${ws.length} weeks met · best streak ${best}</div></div>`;
}
function logSession(t) {
  settleGoals(); t = tasks.find(x => x.id === t.id) || t; // roll a finished week over first
  const d = today();
  upsert({ id: uuid(), task: t.task, status: 'done', due: d, notes: '', completed_at: d, repeat: t.repeat, repeat_from: '', series: t.series, updated_at: new Date().toISOString() });
}
// when a goal's week has ended, every session short of the target is recorded as missed and the goal moves to the current week
// (ids are derived from series+week so two devices settling the same week write the same rows)
function settleGoals() {
  tasks.filter(t => isGoal(t.repeat) && isOpen(t) && t.due && t.due < today()).forEach(t => {
    const n = parseRepeat(t.repeat).n, now = new Date().toISOString();
    let due = t.due, k = 0;
    for (; due < today() && k < 520; k++, due = addPeriod(due, 'weekly', 1)) {
      const short = n - goalDone({ ...t, due });
      for (let i = 0; i < short; i++) upsert({ id: `${t.series}:${due}:${i}`, task: t.task, status: 'missed', due, notes: '', completed_at: '', repeat: t.repeat, repeat_from: '', series: t.series, updated_at: now });
    }
    upsert({ ...t, due, updated_at: now });
  });
}
// a task counted from its due date that is closed late also records every occurrence that fell due before the one being closed as missed
// (due 10/24, done 10/27 -> 10/24, 10/25, 10/26 missed and 10/27 done); catchUp=false skips that, e.g. for a brand-new task
function advance(t, status, catchUp = true) {
  const series = t.series || uuid(), now = new Date().toISOString(), gap = [];
  if (catchUp && t.due && t.repeat_from !== 'done') for (let k = 1, d; (d = addPeriod(t.due, t.repeat, k)) <= today() && k <= 366; k++) gap.push(d);
  if (gap.length) {
    const rec = (due, st) => withStatus({ ...t, id: uuid(), due, series, updated_at: now }, st);
    upsert({ ...withStatus(t, 'missed'), series, updated_at: now });
    gap.slice(0, -1).forEach(d => upsert(rec(d, 'missed')));
    upsert(rec(gap[gap.length - 1], status));
  } else upsert({ ...withStatus(t, status), series });
  if (tasks.some(x => x.series === series && x.id !== t.id && isOpen(x))) return;
  upsert({ id: uuid(), task: t.task, status: 'todo', due: nextDue(t), notes: t.notes || '', completed_at: '', repeat: t.repeat, repeat_from: t.repeat_from || 'due', series, updated_at: new Date().toISOString() });
}
// un-checking a done repeating task drops the still-untouched next occurrence so it isn't duplicated
function reopen(t) {
  const nx = t.series && tasks.filter(x => x.series === t.series && x.id !== t.id && x.status === 'todo' && x.due > (t.due || '')).sort((a, b) => a.due.localeCompare(b.due))[0];
  if (nx) del(nx.id);
  upsert(withStatus(t, 'todo'));
}
// "11 done, 3 missed · streak 3" for a repeating series; streak = latest occurrences done in a row
function seriesStats(series) {
  const xs = tasks.filter(x => x.series === series && !isOpen(x)).sort((a, b) => (b.due || '').localeCompare(a.due || ''));
  const done = xs.filter(x => x.status === 'done').length, missed = xs.length - done;
  let streak = 0; while (streak < xs.length && xs[streak].status === 'done') streak++;
  return `${done} done${missed ? `, ${missed} missed` : ''}${streak > 1 && !isGoal(xs[0].repeat) ? ` · streak ${streak}` : ''}`;
}
// completed_at: keep an existing date if already Done, set today on becoming Done, clear on reopening
const withStatus = (t, status) => ({ ...t, status, completed_at: status !== 'done' ? '' : (t.status === 'done' && t.completed_at) || today() });
// pre-fill the add form's due date with today (and roll it over if the app stays open past midnight)
function setDueDefault() { const i = $('#add').due, d = today(); if (!i.value || i.value === i.defaultValue) i.value = d; i.defaultValue = d; }

async function call(body) {
  const r = await fetch(cfg.url, { method: 'POST', body: JSON.stringify({ token: cfg.token, ...body }) }); // text/plain => no CORS preflight
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || 'request failed');
  return j.tasks;
}

async function sync() {
  if (!cfg.url || !cfg.token) { setStatus('Tap ⚙ to connect your sheet.'); return; }
  if (syncing) return; syncing = true;
  try {
    setStatus('Syncing…');
    let server;
    while (queue.length) { server = await call(queue[0]); queue.shift(); save('queue', queue); }
    server = server || await call({ action: 'list' });
    if (!queue.length) { tasks = server.map(norm); save('tasks', tasks); }
    setStatus('Synced ' + new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }));
  } catch (e) {
    setStatus((navigator.onLine ? 'Sync error: ' + e.message : 'Offline') + (queue.length ? ` · ${queue.length} change(s) pending` : ''));
  } finally { syncing = false; settleGoals(); render(); }
}

function upsert(t) {
  const i = tasks.findIndex(x => x.id === t.id);
  if (i < 0) tasks.unshift(t); else tasks[i] = t;
  save('tasks', tasks); queue.push({ action: 'upsert', task: t }); save('queue', queue); render(); sync();
}
function del(id) {
  tasks = tasks.filter(t => t.id !== id); save('tasks', tasks);
  queue.push({ action: 'delete', id }); save('queue', queue); render(); sync();
}

function render() {
  const fbtn = f => `<button data-f="${f}" class="${f === filter ? 'on' : ''}"${f === 'Repeat' ? ' title="repeating" aria-label="repeating"' : ''}>${f === 'Repeat' ? '↻' : f}</button>`;
  $('#filters').innerHTML = `<div class="frow">${MAIN.map(fbtn).join('')}<button data-more aria-label="more filters" class="${MORE.includes(filter) ? 'on' : ''}">${MORE.includes(filter) ? (filter === 'Repeat' ? '↻' : filter) : '⋯'}</button></div>`
    + (moreOpen ? `<div class="frow">${MORE.map(fbtn).join('')}</div>` : '');
  const shown = tasks.filter(t => query ? ((t.task || '') + ' ' + (t.notes || '')).toLowerCase().includes(query) : filter === 'All' ? true : filter === 'Open' ? isOpen(t) : filter === 'Today' ? isOpen(t) && (isGoal(t.repeat) || t.due && t.due <= today()) : filter === 'Repeat' ? isOpen(t) && t.repeat : t.status === filter)
    .sort((a, b) => !isOpen(a) - !isOpen(b)
      || (filter === 'Today' && isOpen(a) ? !!a.repeat - !!b.repeat || isGoal(a.repeat) - isGoal(b.repeat) : 0) // Today: repeating tasks sink to the bottom, weekly goals last
      || (!isOpen(a) ? (b.completed_at || b.due || '').localeCompare(a.completed_at || a.due || '') || (b.updated_at || '').localeCompare(a.updated_at || '') // same day: latest change first
        : (a.due || '9999').localeCompare(b.due || '9999')));
  $('#searchBtn').classList.toggle('on', !!query);
  $('#list').innerHTML = shown.map(t => {
    const over = t.due && isOpen(t) && t.due < today();
    const soon = t.due && isOpen(t) && t.due > today() && t.due <= inDays(7);
    const tmrw = soon && t.due === inDays(1);
    const ed = editing === t.id, goal = isGoal(t.repeat), plus = goal && isOpen(t);
    const goalN = goal ? parseRepeat(t.repeat).n : 0, got = plus ? goalDone(t) : 0, met = plus && got >= goalN;
    return `<div class="item ${isOpen(t) ? '' : 'done'}${met ? ' met' : ''}" data-id="${t.id}">
      <div class="row">${plus ? `<button class="plus${met ? ' met' : ''}" data-a="log" aria-label="log a session">+1</button>` : `<input type="checkbox" data-a="toggle" ${t.status === 'done' ? 'checked' : ''}>`}
        <span class="t" data-a="edit">${esc(t.task)}${t.status === 'doing' ? ' <small>(doing)</small>' : ''}</span>
        <span class="due ${goal ? '' : over ? 'over' : tmrw ? 'tmrw' : soon ? 'soon' : ''}">${esc(t.due)}</span>
        ${t.status === 'done' && t.completed_at ? `<span class="due">done ${esc(t.completed_at)}</span>` : ''}
        ${t.status === 'missed' ? '<span class="due">missed</span>' : ''}</div>
      ${t.repeat ? `<div class="rep"${plus ? ' data-a="hist"' : ''}>↻ ${esc(repeatLabel(t.repeat))}${plus ? (histOpen.has(t.series) ? ' ▴ history' : ' ▾ history') : t.series ? ' · ' + seriesStats(t.series) : ''}</div>${plus ? goalBox(t) : ''}${plus && histOpen.has(t.series) ? histHtml(t) : ''}` : ''}
      ${t.notes && !ed ? `<div class="notes">${esc(t.notes)}</div>` : ''}
      ${ed ? `<div class="edit"><input name="task" value="${esc(t.task)}">
        <div class="two"><input name="due" type="date" value="${esc(t.due)}">
        <select name="status">${STATUSES.map(s => `<option ${s === t.status ? 'selected' : ''}>${s}</option>`).join('')}</select></div>
        <div class="three"><select name="repeat">${REPEATS.map(r => `<option value="${r}" ${r === parseRepeat(t.repeat).unit || (!r && !t.repeat) ? 'selected' : ''}>${repeatOpt(r)}</option>`).join('')}</select>
        <input name="every" type="number" min="1" value="${parseRepeat(t.repeat).n}" title="Repeat every" aria-label="Repeat every"${t.repeat ? '' : ' disabled'}>
        <select name="repeat_from"><option value="due" ${t.repeat_from !== 'done' ? 'selected' : ''}>from due date</option><option value="done" ${t.repeat_from === 'done' ? 'selected' : ''}>from completion</option></select></div>
        <textarea name="notes" rows="6" placeholder="Notes">${esc(t.notes)}</textarea>
        <div class="btns"><button data-a="del">Delete</button><span>${t.repeat && !goal && isOpen(t) ? '<button data-a="skip">Skip</button> ' : ''}<button data-a="cancel">Cancel</button> <button class="primary" data-a="save">Save</button></span></div></div>` : ''}
    </div>`;
  }).join('') || `<p style="color:var(--mut)">${query ? 'No matches.' : 'Nothing here.'}</p>`;
}

// the add form's extra fields (status, repeat, notes) open when the task box is tapped
const addForm = $('#add'), addEl = n => addForm.elements[n];
addEl('status').innerHTML = ['todo', 'doing', 'done'].map(s => `<option>${s}</option>`).join('');
addEl('repeat').innerHTML = REPEATS.map(r => `<option value="${r}">${repeatOpt(r)}</option>`).join('');
addEl('repeat_from').innerHTML = '<option value="due">from due date</option><option value="done">from completion</option>';
const setStatusDefault = () => addEl('status').value = filter === 'doing' || filter === 'done' ? filter : 'todo';
let skipOpen = false;
const focusTask = () => { skipOpen = true; addEl('task').focus(); skipOpen = false; };
['focus', 'click'].forEach(ev => addEl('task').addEventListener(ev, () => { if (!skipOpen) $('#more').hidden = false; }));
$('#addClose').onclick = () => { $('#more').hidden = true; };
addForm.addEventListener('keydown', e => { if (e.key === 'Escape') $('#more').hidden = true; });
addForm.addEventListener('submit', e => {
  e.preventDefault();
  const repeat = fmtRepeat(addEl('repeat').value, addEl('every').value), status = addEl('status').value;
  const goal = isGoal(repeat);
  const t = { id: uuid(), task: addEl('task').value.trim(), status: 'todo', due: goal ? weekEnd(today()) : addEl('due').value, notes: addEl('notes').value, completed_at: '',
    repeat, repeat_from: repeat && !goal ? addEl('repeat_from').value : '', series: repeat ? uuid() : '', updated_at: new Date().toISOString() };
  if (goal) upsert(t); else if (repeat && status === 'done') advance(t, 'done', false); else upsert(withStatus(t, status));
  addForm.reset(); setDueDefault(); setStatusDefault(); $('#more').hidden = true; focusTask();
});
// the "every N" box only applies while a repeat unit is chosen
const syncEvery = sel => { const n = sel.form ? sel.form.elements.every : sel.parentNode.querySelector('[name=every]'); n.disabled = !sel.value; (sel.form ? sel.form.elements.repeat_from : sel.parentNode.querySelector('[name=repeat_from]')).disabled = sel.value === 'goal'; };
document.addEventListener('change', e => { if (e.target.name === 'repeat') syncEvery(e.target); });
addForm.addEventListener('reset', () => setTimeout(() => syncEvery(addEl('repeat'))));
$('#filters').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if ('more' in b.dataset) { moreOpen = !moreOpen; render(); }
  else if (b.dataset.f) { filter = b.dataset.f; moreOpen = false; setStatusDefault(); render(); }
});
$('#list').addEventListener('click', e => {
  const a = e.target.closest('[data-a]')?.dataset.a, item = e.target.closest('.item'); if (!a || !item) return;
  const t = tasks.find(x => x.id === item.dataset.id);
  if (a === 'log') logSession(t);
  else if (a === 'histall') { histAll.has(t.series) ? histAll.delete(t.series) : histAll.add(t.series); render(); }
  else if (a === 'hist') { histOpen.has(t.series) ? histOpen.delete(t.series) : histOpen.add(t.series); render(); }
  else if (a === 'toggle') { if (isGoal(t.repeat)) del(t.id); else if (t.status === 'done') reopen(t); else if (t.repeat) advance(t, 'done'); else upsert(withStatus(t, 'done')); }
  else if (a === 'skip') { editing = null; advance(t, 'missed'); }
  else if (a === 'edit') { editing = editing === t.id ? null : t.id; render(); }
  else if (a === 'cancel') { editing = null; render(); }
  else if (a === 'del') { if (confirm('Delete this task?')) { editing = null; del(t.id); } }
  else if (a === 'save') {
    const q = n => item.querySelector(`[name=${n}]`).value; editing = null;
    const repeat = fmtRepeat(q('repeat'), q('every')), status = q('status');
    const edited = { ...t, task: q('task').trim() || t.task, due: isGoal(repeat) && !isGoal(t.repeat) ? weekEnd(today()) : q('due'), notes: q('notes'), repeat, repeat_from: repeat && !isGoal(repeat) ? q('repeat_from') : '', series: repeat ? t.series || uuid() : t.series };
    if (repeat && !isGoal(repeat) && isOpen(t) && !isOpen({ status })) advance(edited, status); else upsert(withStatus(edited, status));
  }
});
function toggleSearch(open) {
  const row = $('#searchRow'); open = open ?? row.hidden; row.hidden = !open;
  if (open) $('#q').focus(); else { $('#q').value = ''; query = ''; render(); }
}
$('#searchBtn').onclick = () => toggleSearch();
$('#qx').onclick = () => toggleSearch(false);
$('#q').addEventListener('input', e => { query = e.target.value.trim().toLowerCase(); render(); });
$('#q').addEventListener('keydown', e => { if (e.key === 'Escape') toggleSearch(false); });
$('#refresh').onclick = sync;
$('#cfg').onclick = () => { const f = $('#cfgForm'); f.url.value = cfg.url || ''; f.token.value = cfg.token || ''; $('#dlg').showModal(); };
$('#dlg').addEventListener('close', () => {
  if ($('#dlg').returnValue !== 'ok') return;
  const f = $('#cfgForm'); cfg = { url: f.url.value.trim(), token: f.token.value.trim() }; save('cfg', cfg); sync();
});
document.addEventListener('visibilitychange', () => { if (!document.hidden) setDueDefault(); if (!document.hidden && !editing) sync(); });
window.addEventListener('online', sync);
setInterval(() => { if (!document.hidden && !editing) sync(); }, 30000);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
setDueDefault(); setStatusDefault(); settleGoals(); render(); sync();
</script>
</body>
