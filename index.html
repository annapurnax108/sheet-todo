<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sheet To-Do</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<meta name="theme-color" content="#1a73e8">
<style>
  :root { --bg:#fff; --fg:#202124; --mut:#5f6368; --line:#e0e0e0; --acc:#1a73e8; --card:#f8f9fa; --bad:#d93025; --soon:#1a73e8; --tmrw:#e8710a; }
  @media (prefers-color-scheme: dark) { :root { --bg:#16181b; --fg:#e8eaed; --mut:#9aa0a6; --line:#3c4043; --acc:#8ab4f8; --card:#202327; --bad:#f28b82; --soon:#8ab4f8; --tmrw:#fcad70; } }
  * { box-sizing: border-box; }
body, button, select, input, textarea { text-transform: lowercase; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.4 system-ui,sans-serif; }
  main { max-width:720px; margin:0 auto; padding:16px; }
  header { display:flex; align-items:center; gap:8px; margin-bottom:12px; }
  h1 { font-size:20px; margin:0; }
  #refresh { margin-left:auto; }
  #searchRow { display:flex; gap:8px; margin-bottom:12px; } #searchRow[hidden] { display:none; } #q { flex:1; min-width:0; }
  #searchBtn.on { background:var(--acc); color:#fff; border-color:var(--acc); }
  button, select, input, textarea { font:inherit; color:inherit; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:8px 10px; }
  button { cursor:pointer; } button.primary { background:var(--acc); color:#fff; border-color:var(--acc); }
  #status { color:var(--mut); font-size:13px; margin-bottom:8px; min-height:18px; }
  form#add { display:grid; grid-template-columns:1fr auto auto; gap:8px; margin-bottom:12px; }
  @media (max-width:520px) { form#add { grid-template-columns:minmax(0,1fr) minmax(0,1fr); } form#add input[name=task] { grid-column:1/-1; } }
  #more { grid-column:1/-1; margin-top:0; } #more[hidden] { display:none; }
  #more .btns { display:grid; grid-template-columns:1fr 1fr; gap:8px; } #more .btns button { padding:12px; }
  #addClose { border:2px solid var(--bad); color:var(--bad); font-weight:600; }
  .filters { margin-bottom:12px; } .frow { display:flex; gap:6px; overflow-x:auto; } .frow + .frow { margin-top:6px; }
  .filters button { flex:1 1 0; min-width:0; font-size:13px; padding:6px 2px; text-align:center; }
  .filters button.on { background:var(--acc); color:#fff; border-color:var(--acc); }
  .item { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:8px; }
  .row { display:flex; align-items:center; gap:10px; }
  .row .t { flex:1; word-break:break-word; } .done .t { text-decoration:line-through; color:var(--mut); }
  .due { font-size:13px; color:var(--mut); } .due.over { color:var(--bad); font-weight:600; } .due.soon { color:var(--soon); font-weight:600; } .due.tmrw { color:var(--tmrw); font-weight:600; }
  .rep { color:var(--mut); font-size:12px; margin:4px 0 0 30px; }
  .notes { color:var(--mut); font-size:14px; margin:6px 0 0 30px; white-space:pre-wrap; }
  .edit > *, .edit .two > *, .three > *, #more > * { min-width:0; max-width:100%; }
  .edit select, .edit input, .edit textarea { width:100%; }
  .edit .two { grid-template-columns:minmax(0,1fr) minmax(0,1fr); }
  input[type=date] { min-width:0; width:100%; -webkit-appearance:none; appearance:none; }
  input[type=date]::-webkit-date-and-time-value { text-align:left; }
  .edit input[type=number] { padding-left:4px; padding-right:4px; text-align:center; }
  .three { display:grid; grid-template-columns:1fr 4.2em 1.3fr; gap:8px; } input:disabled { opacity:.45; }
  .edit { display:grid; gap:8px; margin-top:8px; } .edit .two { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .edit .btns { display:flex; gap:8px; justify-content:space-between; }
  input[type=checkbox] { width:22px; height:22px; }
  dialog { border:1px solid var(--line); border-radius:12px; background:var(--bg); color:var(--fg); max-width:420px; width:calc(100% - 32px); }
  dialog label { display:block; margin:8px 0 4px; font-size:14px; } dialog input { width:100%; }
</style>
</head>
<body>
<main>
  <header><h1>To-Do</h1><button id="searchBtn" title="Search" aria-label="Search">🔍</button><button id="refresh" title="Sync now">⟳</button><button id="cfg" title="Settings">⚙</button></header>
  <div id="searchRow" hidden><input id="q" type="search" placeholder="search all tasks…" autocomplete="off"><button id="qx" aria-label="Close search">✕</button></div>
  <div id="status"></div>
  <form id="add">
    <input name="task" placeholder="New task…" required autocomplete="off">
    <input name="due" type="date" title="Due date">
    <select name="status"></select>
    <div id="more" class="edit" hidden>
      <div class="three"><select name="repeat"></select><input name="every" type="number" min="1" value="1" title="Repeat every" aria-label="Repeat every" disabled><select name="repeat_from"></select></div>
      <textarea name="notes" rows="2" placeholder="Notes"></textarea>
      <div class="btns"><button type="button" id="addClose">✕ close</button><button class="primary">add</button></div>
    </div>
  </form>
  <div class="filters" id="filters"></div>
  <div id="list"></div>
</main>

<dialog id="dlg">
  <form method="dialog" id="cfgForm">
    <h3>Connect to your sheet</h3>
    <label>Web app URL</label><input name="url" placeholder="https://script.google.com/macros/s/…/exec">
    <label>Secret token</label><input name="token" type="password">
    <p style="text-align:right"><button value="cancel">Cancel</button> <button class="primary" value="ok">Save</button></p>
  </form>
</dialog>

<script>
const $ = s => document.querySelector(s);
const STATUSES = ['todo', 'doing', 'done', 'missed'];
const REPEATS = ['', 'daily', 'weekly', 'monthly', 'yearly'];
const UNITS = { daily: 'day', weekly: 'week', monthly: 'month', yearly: 'year' };
// the interval lives in the repeat cell: 'monthly' = every 1, 'monthly/6' = every 6 months
const repeatOpt = r => r ? 'repeat ' + UNITS[r] + 's' : 'no repeat';
const parseRepeat = r => { const [unit, n] = String(r || '').split('/'); return { unit, n: Math.max(1, parseInt(n, 10) || 1) }; };
const fmtRepeat = (unit, n) => !unit ? '' : (n = Math.max(1, parseInt(n, 10) || 1)) > 1 ? `${unit}/${n}` : unit;
const repeatLabel = r => { const { unit, n } = parseRepeat(r); return n > 1 ? `every ${n} ${UNITS[unit]}s` : unit; };
const MAIN = ['Open', 'Today', 'doing', 'missed', 'Repeat'], MORE = ['todo', 'done', 'All']; // filter buttons: main row, and the ⋯ menu
let moreOpen = false;
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
const save = (k, v) => localStorage.setItem(k, JSON.stringify(v));
const norm = t => ({ repeat: '', repeat_from: '', series: '', ...t, status: String(t.status || 'todo').toLowerCase() }); // sheet may hold Done/done
const isOpen = t => t.status !== 'done' && t.status !== 'missed';
let cfg = load('cfg', {}), tasks = load('tasks', []).map(norm), queue = load('queue', []), filter = 'Today', query = '', editing = null, syncing = false;

const uuid = () => crypto.randomUUID ? crypto.randomUUID() : 'id-' + Date.now() + Math.random().toString(16).slice(2);
const today = () => new Date().toLocaleDateString('en-CA');
const inDays = n => { const d = new Date(); d.setDate(d.getDate() + n); return d.toLocaleDateString('en-CA'); };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const setStatus = m => $('#status').textContent = m;
// k periods after iso (yyyy-mm-dd); monthly/yearly clamp to the last day of shorter months
function addPeriod(iso, repeat, k) {
  const [y, m, d] = iso.split('-').map(Number), { unit, n } = parseRepeat(repeat);
  k *= n;
  if (unit === 'daily' || unit === 'weekly') return new Date(y, m - 1, d + k * (unit === 'weekly' ? 7 : 1)).toLocaleDateString('en-CA');
  const first = new Date(y, m - 1 + k * (unit === 'yearly' ? 12 : 1), 1);
  const last = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
  return new Date(first.getFullYear(), first.getMonth(), Math.min(d, last)).toLocaleDateString('en-CA');
}
// next occurrence: counted from the due date or from today (completion), always in the future so a late task doesn't pile up copies
function nextDue(t) {
  const base = t.repeat_from === 'done' ? today() : (t.due || today());
  let k = 1, n = addPeriod(base, t.repeat, k);
  while (n <= today()) n = addPeriod(base, t.repeat, ++k);
  return n;
}
// close a repeating task as done/missed and create its next occurrence (unless one is already open)
function advance(t, status) {
  const series = t.series || uuid();
  upsert({ ...withStatus(t, status), series });
  if (tasks.some(x => x.series === series && x.id !== t.id && isOpen(x))) return;
  upsert({ id: uuid(), task: t.task, status: 'todo', due: nextDue(t), notes: t.notes || '', completed_at: '', repeat: t.repeat, repeat_from: t.repeat_from || 'due', series, updated_at: new Date().toISOString() });
}
// un-checking a done repeating task drops the still-untouched next occurrence so it isn't duplicated
function reopen(t) {
  const nx = t.series && tasks.filter(x => x.series === t.series && x.id !== t.id && x.status === 'todo' && x.due > (t.due || '')).sort((a, b) => a.due.localeCompare(b.due))[0];
  if (nx) del(nx.id);
  upsert(withStatus(t, 'todo'));
}
// "11 done, 3 missed · streak 3" for a repeating series; streak = latest occurrences done in a row
function seriesStats(series) {
  const xs = tasks.filter(x => x.series === series && !isOpen(x)).sort((a, b) => (b.due || '').localeCompare(a.due || ''));
  const done = xs.filter(x => x.status === 'done').length, missed = xs.length - done;
  let streak = 0; while (streak < xs.length && xs[streak].status === 'done') streak++;
  return `${done} done${missed ? `, ${missed} missed` : ''}${streak > 1 ? ` · streak ${streak}` : ''}`;
}
// completed_at: keep an existing date if already Done, set today on becoming Done, clear on reopening
const withStatus = (t, status) => ({ ...t, status, completed_at: status !== 'done' ? '' : (t.status === 'done' && t.completed_at) || today() });
// pre-fill the add form's due date with today (and roll it over if the app stays open past midnight)
function setDueDefault() { const i = $('#add').due, d = today(); if (!i.value || i.value === i.defaultValue) i.value = d; i.defaultValue = d; }

async function call(body) {
  const r = await fetch(cfg.url, { method: 'POST', body: JSON.stringify({ token: cfg.token, ...body }) }); // text/plain => no CORS preflight
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || 'request failed');
  return j.tasks;
}

async function sync() {
  if (!cfg.url || !cfg.token) { setStatus('Tap ⚙ to connect your sheet.'); return; }
  if (syncing) return; syncing = true;
  try {
    setStatus('Syncing…');
    let server;
    while (queue.length) { server = await call(queue[0]); queue.shift(); save('queue', queue); }
    server = server || await call({ action: 'list' });
    if (!queue.length) { tasks = server.map(norm); save('tasks', tasks); }
    setStatus('Synced ' + new Date().toLocaleTimeString());
  } catch (e) {
    setStatus((navigator.onLine ? 'Sync error: ' + e.message : 'Offline') + (queue.length ? ` · ${queue.length} change(s) pending` : ''));
  } finally { syncing = false; render(); }
}

function upsert(t) {
  const i = tasks.findIndex(x => x.id === t.id);
  if (i < 0) tasks.unshift(t); else tasks[i] = t;
  save('tasks', tasks); queue.push({ action: 'upsert', task: t }); save('queue', queue); render(); sync();
}
function del(id) {
  tasks = tasks.filter(t => t.id !== id); save('tasks', tasks);
  queue.push({ action: 'delete', id }); save('queue', queue); render(); sync();
}

function render() {
  const fbtn = f => `<button data-f="${f}" class="${f === filter ? 'on' : ''}"${f === 'Repeat' ? ' title="repeating" aria-label="repeating"' : ''}>${f === 'Repeat' ? '↻' : f}</button>`;
  $('#filters').innerHTML = `<div class="frow">${MAIN.map(fbtn).join('')}<button data-more aria-label="more filters" class="${MORE.includes(filter) ? 'on' : ''}">${MORE.includes(filter) ? filter : '⋯'}</button></div>`
    + (moreOpen ? `<div class="frow">${MORE.map(fbtn).join('')}</div>` : '');
  const shown = tasks.filter(t => query ? ((t.task || '') + ' ' + (t.notes || '')).toLowerCase().includes(query) : filter === 'All' ? true : filter === 'Open' ? isOpen(t) : filter === 'Today' ? isOpen(t) && t.due && t.due <= today() : filter === 'Repeat' ? isOpen(t) && t.repeat : t.status === filter)
    .sort((a, b) => !isOpen(a) - !isOpen(b)
      || (filter === 'Today' && isOpen(a) ? !!a.repeat - !!b.repeat : 0) // Today: repeating tasks sink to the bottom
      || (!isOpen(a) ? (b.completed_at || b.due || '').localeCompare(a.completed_at || a.due || '') || (b.updated_at || '').localeCompare(a.updated_at || '') // same day: latest change first
        : (a.due || '9999').localeCompare(b.due || '9999')));
  $('#searchBtn').classList.toggle('on', !!query);
  $('#list').innerHTML = shown.map(t => {
    const over = t.due && isOpen(t) && t.due < today();
    const soon = t.due && isOpen(t) && t.due > today() && t.due <= inDays(7);
    const tmrw = soon && t.due === inDays(1);
    const ed = editing === t.id;
    return `<div class="item ${isOpen(t) ? '' : 'done'}" data-id="${t.id}">
      <div class="row"><input type="checkbox" data-a="toggle" ${t.status === 'done' ? 'checked' : ''}>
        <span class="t" data-a="edit">${esc(t.task)}${t.status === 'doing' ? ' <small>(doing)</small>' : ''}</span>
        <span class="due ${over ? 'over' : tmrw ? 'tmrw' : soon ? 'soon' : ''}">${esc(t.due)}</span>
        ${t.status === 'done' && t.completed_at ? `<span class="due">done ${esc(t.completed_at)}</span>` : ''}
        ${t.status === 'missed' ? '<span class="due">missed</span>' : ''}</div>
      ${t.repeat ? `<div class="rep">↻ ${esc(repeatLabel(t.repeat))}${t.series ? ' · ' + seriesStats(t.series) : ''}</div>` : ''}
      ${t.notes && !ed ? `<div class="notes">${esc(t.notes)}</div>` : ''}
      ${ed ? `<div class="edit"><input name="task" value="${esc(t.task)}">
        <div class="two"><input name="due" type="date" value="${esc(t.due)}">
        <select name="status">${STATUSES.map(s => `<option ${s === t.status ? 'selected' : ''}>${s}</option>`).join('')}</select></div>
        <div class="three"><select name="repeat">${REPEATS.map(r => `<option value="${r}" ${r === parseRepeat(t.repeat).unit || (!r && !t.repeat) ? 'selected' : ''}>${repeatOpt(r)}</option>`).join('')}</select>
        <input name="every" type="number" min="1" value="${parseRepeat(t.repeat).n}" title="Repeat every" aria-label="Repeat every"${t.repeat ? '' : ' disabled'}>
        <select name="repeat_from"><option value="due" ${t.repeat_from !== 'done' ? 'selected' : ''}>from due date</option><option value="done" ${t.repeat_from === 'done' ? 'selected' : ''}>from completion</option></select></div>
        <textarea name="notes" rows="3" placeholder="Notes">${esc(t.notes)}</textarea>
        <div class="btns"><button data-a="del">Delete</button><span>${t.repeat && isOpen(t) ? '<button data-a="skip">Skip</button> ' : ''}<button data-a="cancel">Cancel</button> <button class="primary" data-a="save">Save</button></span></div></div>` : ''}
    </div>`;
  }).join('') || `<p style="color:var(--mut)">${query ? 'No matches.' : 'Nothing here.'}</p>`;
}

// the add form's extra fields (status, repeat, notes) open when the task box is tapped
const addForm = $('#add'), addEl = n => addForm.elements[n];
addEl('status').innerHTML = ['todo', 'doing', 'done'].map(s => `<option>${s}</option>`).join('');
addEl('repeat').innerHTML = REPEATS.map(r => `<option value="${r}">${repeatOpt(r)}</option>`).join('');
addEl('repeat_from').innerHTML = '<option value="due">from due date</option><option value="done">from completion</option>';
const setStatusDefault = () => addEl('status').value = filter === 'doing' || filter === 'done' ? filter : 'todo';
let skipOpen = false;
const focusTask = () => { skipOpen = true; addEl('task').focus(); skipOpen = false; };
['focus', 'click'].forEach(ev => addEl('task').addEventListener(ev, () => { if (!skipOpen) $('#more').hidden = false; }));
$('#addClose').onclick = () => { $('#more').hidden = true; };
addForm.addEventListener('keydown', e => { if (e.key === 'Escape') $('#more').hidden = true; });
addForm.addEventListener('submit', e => {
  e.preventDefault();
  const repeat = fmtRepeat(addEl('repeat').value, addEl('every').value), status = addEl('status').value;
  const t = { id: uuid(), task: addEl('task').value.trim(), status: 'todo', due: addEl('due').value, notes: addEl('notes').value, completed_at: '',
    repeat, repeat_from: repeat ? addEl('repeat_from').value : '', series: repeat ? uuid() : '', updated_at: new Date().toISOString() };
  if (repeat && status === 'done') advance(t, 'done'); else upsert(withStatus(t, status));
  addForm.reset(); setDueDefault(); setStatusDefault(); $('#more').hidden = true; focusTask();
});
// the "every N" box only applies while a repeat unit is chosen
const syncEvery = sel => { const n = sel.form ? sel.form.elements.every : sel.parentNode.querySelector('[name=every]'); n.disabled = !sel.value; };
document.addEventListener('change', e => { if (e.target.name === 'repeat') syncEvery(e.target); });
addForm.addEventListener('reset', () => setTimeout(() => syncEvery(addEl('repeat'))));
$('#filters').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if ('more' in b.dataset) { moreOpen = !moreOpen; render(); }
  else if (b.dataset.f) { filter = b.dataset.f; moreOpen = false; setStatusDefault(); render(); }
});
$('#list').addEventListener('click', e => {
  const a = e.target.closest('[data-a]')?.dataset.a, item = e.target.closest('.item'); if (!a || !item) return;
  const t = tasks.find(x => x.id === item.dataset.id);
  if (a === 'toggle') { if (t.status === 'done') reopen(t); else if (t.repeat) advance(t, 'done'); else upsert(withStatus(t, 'done')); }
  else if (a === 'skip') { editing = null; advance(t, 'missed'); }
  else if (a === 'edit') { editing = editing === t.id ? null : t.id; render(); }
  else if (a === 'cancel') { editing = null; render(); }
  else if (a === 'del') { if (confirm('Delete this task?')) { editing = null; del(t.id); } }
  else if (a === 'save') {
    const q = n => item.querySelector(`[name=${n}]`).value; editing = null;
    const repeat = fmtRepeat(q('repeat'), q('every')), status = q('status');
    const edited = { ...t, task: q('task').trim() || t.task, due: q('due'), notes: q('notes'), repeat, repeat_from: repeat ? q('repeat_from') : '', series: repeat ? t.series || uuid() : t.series };
    if (repeat && isOpen(t) && !isOpen({ status })) advance(edited, status); else upsert(withStatus(edited, status));
  }
});
function toggleSearch(open) {
  const row = $('#searchRow'); open = open ?? row.hidden; row.hidden = !open;
  if (open) $('#q').focus(); else { $('#q').value = ''; query = ''; render(); }
}
$('#searchBtn').onclick = () => toggleSearch();
$('#qx').onclick = () => toggleSearch(false);
$('#q').addEventListener('input', e => { query = e.target.value.trim().toLowerCase(); render(); });
$('#q').addEventListener('keydown', e => { if (e.key === 'Escape') toggleSearch(false); });
$('#refresh').onclick = sync;
$('#cfg').onclick = () => { const f = $('#cfgForm'); f.url.value = cfg.url || ''; f.token.value = cfg.token || ''; $('#dlg').showModal(); };
$('#dlg').addEventListener('close', () => {
  if ($('#dlg').returnValue !== 'ok') return;
  const f = $('#cfgForm'); cfg = { url: f.url.value.trim(), token: f.token.value.trim() }; save('cfg', cfg); sync();
});
document.addEventListener('visibilitychange', () => { if (!document.hidden) setDueDefault(); if (!document.hidden && !editing) sync(); });
window.addEventListener('online', sync);
setInterval(() => { if (!document.hidden && !editing) sync(); }, 30000);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
setDueDefault(); setStatusDefault(); render(); sync();
</script>
</body>
</html>
